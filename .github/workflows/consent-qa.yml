name: Cookie consent QA

on:
  pull_request:
    paths:
      - "index-v2.html"
      - "assets/tib-consent.js"
      - "assets/tib-consent.css"
      - "functions/**"
      - "_routes.json"
      - "_redirects"
      - "privacy-policy/**"
      - "work-with-me/**"
      - "404_not_found/**"
      - "author/**"
      - "blog/**"
      - "tib-admin-avatar.png"
      - "robots.txt"
      - "sitemap.xml"
      - "sitemap_index.xml"
      - "tools/package-site.sh"
      - "qa/test_blog_publication.py"
      - "qa/test_blog_measurement.mjs"
      - ".github/workflows/consent-qa.yml"

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        run: |
          python -m pip install -r qa/requirements.txt
          google-chrome --version
      - name: Verify consent-aware article measurement
        run: node --test qa/test_blog_measurement.mjs
      - name: Assemble Pages preview root
        run: sh tools/package-site.sh /tmp/tib-pages-preview
      - name: Start local Pages runtime
        run: |
          npx --yes wrangler@latest pages dev /tmp/tib-pages-preview --ip 127.0.0.1 --port 8788 --compatibility-date=2026-11-19 > /tmp/tib-wrangler.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8788/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/tib-wrangler.log
          exit 1
      - name: Verify blog and sitemap publication
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8788/blog/ > /tmp/tib-blog.html
          curl --fail --silent --show-error http://127.0.0.1:8788/blog/plan-your-strength-training-week/ > /tmp/tib-article.html
          for page in /tmp/tib-blog.html /tmp/tib-article.html; do
            grep -Fq '<meta name="robots" content="index,follow">' "$page"
            grep -Fq '<time datetime=' "$page"
          done
          curl --fail --silent --show-error http://127.0.0.1:8788/tib-admin-avatar.png > /tmp/tib-avatar.png
          test -s /tmp/tib-avatar.png
          curl --fail --silent --show-error http://127.0.0.1:8788/sitemap.xml | python -c 'import sys, xml.etree.ElementTree as ET; root = ET.parse(sys.stdin).getroot(); ns = "{http://www.sitemaps.org/schemas/sitemap/0.9}"; assert root.tag == ns + "urlset"; urls = {node.text for node in root.iter(ns + "loc")}; assert "https://www.theinfinitebody.com/blog/" in urls; assert "https://www.theinfinitebody.com/blog/plan-your-strength-training-week/" in urls'
          curl --fail --silent --show-error http://127.0.0.1:8788/sitemap_index.xml | python -c 'import sys, xml.etree.ElementTree as ET; root = ET.parse(sys.stdin).getroot(); ns = "{http://www.sitemaps.org/schemas/sitemap/0.9}"; assert root.tag == ns + "sitemapindex"; assert [node.text for node in root.iter(ns + "loc")] == ["https://www.theinfinitebody.com/sitemap.xml"]'
      - name: Verify article URL migration
        run: python qa/test_blog_publication.py
      - name: Run consent browser QA
        env:
          TIB_PREVIEW_URL: http://127.0.0.1:8788
          TIB_BROWSER_EXECUTABLE: /usr/bin/google-chrome
        run: python qa/test_cookie_consent.py
